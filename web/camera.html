
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignSight | Camera Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0e14;
      color: #e8ecf2;
      font-family: Inter, Arial, sans-serif;
      padding: 32px;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      color: #a3adbd;
      font-size: 14px;
      margin-top: 8px;
    }

    .badge {
      padding: 9px 14px;
      border-radius: 30px;
      background: #1a202b;
      color: #c4cbd7;
      font-size: 13px;
    }

    .badge.live {
      background: #10261b;
      color: #7eedb5;
    }

    .camera-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: 560px;
      background: #05070b;
      border: 1px solid #252d3a;
      border-radius: 16px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #05070b;
    }

    video.mirrored {
      transform: scaleX(-1);
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #a3adbd;
      text-align: center;
      padding: 20px;
    }

    .placeholder .icon {
      font-size: 45px;
    }

    .camera-info {
      position: absolute;
      top: 15px;
      left: 15px;
      padding: 8px 12px;
      background: rgba(5, 7, 11, 0.8);
      border-radius: 8px;
      font-size: 12px;
    }

    .camera-status {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      background: rgba(5, 7, 11, 0.85);
      padding: 13px 15px;
      border: 1px solid #252d3a;
      border-radius: 10px;
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      border: 1px solid #303948;
      border-radius: 10px;
      padding: 13px 22px;
      background: #1a202b;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary {
      background: #2563eb;
      border-color: #2563eb;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.15);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #e8ecf2;
      font-size: 14px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      accent-color: #2563eb;
      width: 17px;
      height: 17px;
    }

    .details {
      margin-top: 20px;
      background: #131821;
      padding: 20px;
      border: 1px solid #252d3a;
      border-radius: 12px;
    }

    .details p {
      margin: 9px 0;
      color: #c4cbd7;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div>
        <h1>✋ SignSight · Camera Test</h1>
        <p class="subtitle">
          Live webcam preview without OpenCV
        </p>
      </div>

      <span id="cameraBadge" class="badge">Stopped</span>
    </header>

    <section class="camera-container">

      <video
        id="cameraVideo"
        autoplay
        muted
        playsinline
        class="mirrored"
      ></video>

      <div id="placeholder" class="placeholder">
        <span class="icon">📷</span>
        <strong>Camera is off</strong>
        <span>Press Start Camera to begin.</span>
      </div>

      <div id="cameraInfo" class="camera-info" hidden>
        No video
      </div>

      <div id="cameraStatus" class="camera-status" role="status" aria-live="polite">
        Camera stopped.
      </div>

    </section>

    <div class="controls">

      <button id="startCamera" class="primary">
        ▶ Start Camera
      </button>

      <button id="stopCamera" disabled>
        ■ Stop Camera
      </button>

      <label class="toggle">
        <input id="mirrorToggle" type="checkbox" checked>
        Mirror view
      </label>

    </div>

    <section class="details">
      <strong>Camera information</strong>

      <p id="resolution">
        Resolution: —
      </p>

      <p id="deviceStatus">
        Device: Not connected
      </p>

      <p>
        Processing: Webcam preview only
      </p>

      <p>
        AI model: JAX not connected
      </p>
    </section>

  </main>

  <script src="./camera.js" defer></script>
</body>
</html>
